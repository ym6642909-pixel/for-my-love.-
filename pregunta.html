<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Una pregunta</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div><main>
<div class="emoji" id="em" aria-hidden="true">🥺</div>
<h1 id="q"><span class="nombre"></span>, ¿me das una oportunidad?</h1>
<div id="btns" style="min-height:120px">
<button class="btn" id="yes">¡Sí! 💖</button>
<button class="btn ghost" id="no">No</button>
</div>
</main><script src="script.js"></script>
<script>
const yes=document.getElementById('yes'),no=document.getElementById('no');
const T=["¿Segura? 🥺","Piénsalo bien…","Porfi 🙏","Mira qué grande es el Sí 👉","Casi no me alcanzas 😅"];
let n=0;
function huir(e){e.preventDefault();n++;no.textContent=T[n%T.length];no.style.position='fixed';no.style.zIndex=3;
no.style.left=Math.random()*(innerWidth-150)+'px';no.style.top=Math.random()*(innerHeight-60)+'px';
yes.style.transform='scale('+Math.min(1+n*.15,2.2)+')';}
['mouseenter','touchstart','click'].forEach(t=>no.addEventListener(t,huir));
yes.onclick=()=>{
document.getElementById('em').textContent='🥰';
document.getElementById('q').textContent='¡Gracias! Me has hecho muy feliz 💖';
document.getElementById('btns').innerHTML='<p style="color:var(--soft)">Prometo cuidar cada conversación contigo. 🌸</p>';
const c=document.createElement('div');c.className='conf';document.body.appendChild(c);
for(let i=0;i<50;i++){const s=document.createElement('span');s.textContent=['💖','🎉','✨','💛'][i%4];
s.style.left=Math.random()*100+'%';s.style.fontSize=20+Math.random()*26+'px';
s.style.animationDuration=3+Math.random()*3+'s';s.style.animationDelay=Math.random()*1.2+'s';c.appendChild(s)}
};
</script></body></html>
