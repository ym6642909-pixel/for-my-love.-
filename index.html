<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entre Dos Mundos</title>
  
  <!-- CesiumJS CSS -->
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Globe Container -->
  <div id="cesiumContainer"></div>

  <!-- Romantic UI Overlay -->
  <div class="overlay-container">
    <header class="header">
      <h1 class="title">Entre Dos Mundos</h1>
      <p class="subtitle">Egipto <span class="heart">♥</span> Honduras</p>
    </header>

    <div class="info-card">
      <div class="distance-box">
        <span class="label">Distancia actual:</span>
        <span id="distanceValue" class="distance-number">Calculando...</span>
      </div>

      <div class="controls">
        <button id="btnFly" class="btn-cinematic">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
          </svg>
          Mostrar el camino
        </button>
        
        <button id="btnReset" class="btn-secondary">
          Vista general
        </button>
      </div>
    </div>
  </div>

  <!-- CesiumJS Library -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  
  <!-- Main Application Script -->
  <script src="js/main.js"></script>
</body>
</html>
