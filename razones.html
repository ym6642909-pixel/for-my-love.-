<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis razones</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div><main>
<h1>Razones por las que me encantas</h1>
<ul class="chips" id="l" aria-live="polite"></ul>
<button class="btn ghost" id="otra">Otra razón ✨</button>
<a class="btn" id="sig" href="pregunta.html" hidden>Última página 🥺</a>
</main><script src="script.js"></script>
<script>
const R=["💖 Tu sonrisa me alegra el día, incluso a miles de kilómetros.","😂 Te ríes de mis bromas, hasta de las malas.","🌸 Eres amable con todo el mundo, y se nota.","💬 Hablar contigo es lo mejor de mi día.","🌟 Me haces querer ser mejor persona.","💛 Y simplemente… porque eres tú."];
let i=0;const l=document.getElementById('l'),b=document.getElementById('otra');
function add(){const li=document.createElement('li');li.textContent=R[i++];l.appendChild(li);
if(i===R.length){b.hidden=true;document.getElementById('sig').hidden=false}}
b.onclick=add;add();
</script></body></html>
