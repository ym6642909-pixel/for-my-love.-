<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#05070d">

    <title>Entre Dos Mundos</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ3XjY7Q5vVf2v2KkZ5Y5Y5Y5Y5Y5Y="
        crossorigin=""
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =====================================
         INTRO
    ====================================== -->

    <main id="app">

        <section id="intro" class="scene active">

            <div class="intro-content">

                <p class="eyebrow">
                    ENTRE DOS MUNDOS
                </p>

                <h1>
                    Dos países.
                    <br>
                    Un solo camino.
                </h1>

                <p class="intro-text">
                    Entre Egipto y Honduras hay un mundo entero.
                </p>

                <button id="startJourney" class="primary-button">
                    Descubrir la distancia
                </button>

            </div>

        </section>


        <!-- =====================================
             MAP SCENE
        ====================================== -->

        <section id="mapScene" class="scene">

            <div id="map"></div>


            <!-- Top information -->

            <div class="map-header">

                <div class="location-card">
                    <span class="country-label">
                        EGIPTO
                    </span>

                    <strong>
                        🇪🇬
                    </strong>
                </div>


                <div class="distance-container">

                    <span>
                        DISTANCIA
                    </span>

                    <strong id="distance">
                        0 km
                    </strong>

                </div>


                <div class="location-card">

                    <span class="country-label">
                        HONDURAS
                    </span>

                    <strong>
                        🇭🇳
                    </strong>

                </div>

            </div>


            <!-- Bottom story -->

            <div class="map-story">

                <p id="storyText">
                    Hay un mundo entero entre nosotros...
                </p>

                <button id="travelButton" class="primary-button">
                    Mostrar el camino
                </button>

            </div>

        </section>


        <!-- =====================================
             FINAL SCENE
        ====================================== -->

        <section id="finalScene" class="scene">

            <div class="final-content">

                <p class="eyebrow">
                    ENTRE EGIPTO Y HONDURAS
                </p>

                <h2>
                    El mundo es enorme...
                </h2>

                <p>
                    pero algunas personas hacen
                    que la distancia parezca pequeña.
                </p>

                <div class="heart">
                    ♥
                </div>

                <p class="signature">
                    Yousef &amp; Dacia
                </p>

            </div>

        </section>

    </main>


    <!-- =====================================
         LEAFLET
    ====================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>


    <!-- =====================================
         MAIN JAVASCRIPT
    ====================================== -->

    <script src="js/main.js"></script>

</body>
</html>
