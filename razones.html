<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis razones</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="float" aria-hidden="true"></div><main>
<h1>Razones por las que me encantas 💖</h1>
<div class="card" aria-live="polite"><p id="r" style="font-size:1.25rem;min-height:5em"></p><small id="c"></small></div>
<button class="btn sec" id="otra">Otra razón ✨</button>
<a class="btn" id="sig" href="pregunta.html" hidden>Última página 🥺</a>
</main><script src="script.js"></script>
<script>
const R=["Tu sonrisa me alegra el día, incluso a miles de kilómetros.","Te ríes de mis bromas, hasta de las malas (¡gracias!).","Eres amable con todo el mundo, y eso se nota.","Hablar contigo es la mejor parte de mi día.","Me haces querer ser mejor persona.","Y simplemente… porque eres tú. 🌸"];
let i=0;const r=document.getElementById('r'),c=document.getElementById('c'),b=document.getElementById('otra');
function show(){r.textContent=R[i];c.textContent=(i+1)+' de '+R.length;if(i===R.length-1){b.hidden=true;document.getElementById('sig').hidden=false}else i++}
b.onclick=show;show();
</script></body></html>
