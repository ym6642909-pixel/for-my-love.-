<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Una pequeña historia ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Poppins,sans-serif;color:white;background:#090308}
canvas{position:fixed;inset:0;width:100%;height:100%}
.scene{position:relative;z-index:2;width:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{width:min(720px,94vw);min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 28px;border:1px solid #ffffff22;border-radius:32px;background:#ffffff0d;backdrop-filter:blur(18px);box-shadow:0 30px 100px #0009;animation:in 1.3s both}
.kicker{letter-spacing:5px;text-transform:uppercase;color:#efa9bd;font-size:.72rem}
h1{font:700 clamp(2.7rem,8vw,5.5rem)/1 "Playfair Display";margin:17px 0}
p{color:#f3dce4;line-height:1.8}
button{border:0;border-radius:999px;padding:15px 30px;background:white;color:#3b0d1d;font:600 1rem Poppins;cursor:pointer;transition:.3s;box-shadow:0 12px 35px #0005}
button:hover{transform:translateY(-4px) scale(1.03)}
.heart{font-size:3.3rem;animation:pulse 1.7s infinite}.secret{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);opacity:.25;font-size:.7rem}
.fade{animation:out .8s forwards}@keyframes in{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}@keyframes out{to{opacity:0;transform:scale(1.06);filter:blur(8px)}}@keyframes pulse{50%{transform:scale(1.15)}}

@media (max-width:600px){
.card{width:calc(100vw - 32px);min-height:calc(100dvh - 40px);padding:34px 20px;border-radius:26px}
h1{max-width:100%}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="scene" id="scene"><section class="card">
<div class="heart" id="heart">❤️</div><div class="kicker">Antes de empezar...</div>
<h1>Hay algo que quiero contarte.</h1>
<p id="intro">No es una historia enorme. Es solo un pequeño momento que preparé especialmente para ti.</p>
<button id="start">Comenzar la historia ✨</button>
</section></div>
<div class="secret">Psst... el corazón guarda un secreto 👀</div>
<script>
const c=document.getElementById('bg'),x=c.getContext('2d');let w,h,stars=[],mx=0,my=0;
function size(){w=c.width=innerWidth;h=c.height=innerHeight;stars=Array.from({length:110},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.2,p:Math.random()*6.28}))}function draw(){x.clearRect(0,0,w,h);stars.forEach(s=>{s.p+=.015;x.globalAlpha=.25+.3*Math.sin(s.p);x.fillStyle='#fff';x.beginPath();x.arc(s.x+(mx*.015),s.y+(my*.015),s.r,0,7);x.fill()});requestAnimationFrame(draw)}addEventListener('resize',size);addEventListener('pointermove',e=>{mx=e.clientX-w/2;my=e.clientY-h/2});size();draw();
let taps=0;document.getElementById('heart').onclick=()=>{taps++;if(taps===5){document.getElementById('intro').textContent='💌 Secreto desbloqueado: probablemente ya sabes por qué hice esta página... 😏❤️';document.getElementById('heart').textContent='💖'}};
document.getElementById('start').onclick=()=>{scene.classList.add('fade');setTimeout(()=>location.href='mensaje.html',700)};
</script>
</body>
</html>
