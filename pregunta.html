<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Una pregunta</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="float" aria-hidden="true"></div><main>
<div class="big" aria-hidden="true" id="em">🥺</div>
<h1 id="q"><span class="nombre"></span>, ¿me das una oportunidad?</h1>
<div id="btns" style="min-height:130px;position:relative">
<button class="btn yes" id="yes">¡Sí! 💖</button>
<button class="btn" id="no">No 💔</button>
</div>
</main><script src="script.js"></script>
<script>
const yes=document.getElementById('yes'),no=document.getElementById('no');
const T=["¿Segura? 🥺","Piénsalo bien…","Porfi 🙏","Mira qué botón tan grande 👉","Casi no puedes pulsarlo 😅"];
let n=0;
function huir(e){e.preventDefault();n++;no.textContent=T[n%T.length];
 no.style.position='fixed';no.style.left=Math.random()*(innerWidth-130)+'px';no.style.top=Math.random()*(innerHeight-60)+'px';
 yes.style.transform='scale('+Math.min(1+n*.15,2.2)+')';}
no.addEventListener('mouseenter',huir);no.addEventListener('touchstart',huir);no.addEventListener('click',huir);
yes.onclick=()=>{
 document.getElementById('em').textContent='🥰';
 document.getElementById('q').innerHTML='¡Gracias! Me has hecho el hombre más feliz 💖';
 document.getElementById('btns').innerHTML='<p>Prometo cuidar cada conversación contigo. 🌸</p>';
 const f=document.querySelector('.float');
 for(let i=0;i<40;i++){const s=document.createElement('span');s.textContent=['💖','🎉','✨','💛'][i%4];
 s.style.left=Math.random()*100+'%';s.style.fontSize=20+Math.random()*28+'px';s.style.opacity=1;
 s.style.animationDuration=3+Math.random()*4+'s';s.style.animationDelay=Math.random()*1.5+'s';f.appendChild(s)}
};
</script></body></html>
